<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RevoShop | Product Catalog</title>
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="dist/output.css" />
    <script type="module" src="dist/main.js"></script>
  </head>
  <body class="min-h-screen bg-page text-ink antialiased">
    <header class="sticky top-0 z-10 border-b border-line bg-white/90 backdrop-blur">
      <div class="mx-auto flex max-w-5xl items-center justify-between gap-4 px-4 py-3 sm:px-6">
        <a href="#top" class="text-xl font-extrabold tracking-tight text-brand-dark sm:text-2xl">
          Revo<span class="text-brand">Shop</span>
        </a>

        <p
          class="flex items-center gap-2 rounded-full bg-brand-light px-3 py-1.5 text-sm font-semibold text-brand-dark sm:px-4"
          aria-live="polite"
          aria-atomic="true"
        >
          <svg class="size-5 shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.25 3h1.386c.51 0 .955.343 1.087.835l.383 1.437M7.5 14.25a3 3 0 0 0-3 3h15.75m-12.75-3h11.218c1.121-2.3 2.1-4.684 2.924-7.138a60.114 60.114 0 0 0-16.536-1.84M7.5 14.25 5.106 5.272M6 20.25a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Zm12.75 0a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z"
            />
          </svg>
          <span class="sr-only">Cart:</span>
          <span id="cart-count">0 items</span>
          <span class="text-brand" aria-hidden="true">·</span>
          <span id="cart-total">Rp 0</span>
        </p>
      </div>
    </header>

    <main id="top" class="mx-auto max-w-5xl px-4 py-8 sm:px-6 sm:py-12">
      <div class="mb-8 max-w-2xl">
        <p class="text-xs font-semibold uppercase tracking-widest text-brand sm:text-sm">New arrivals</p>
        <h1 class="mt-2 text-3xl font-extrabold leading-tight tracking-tight sm:text-4xl lg:text-5xl">
          Product Catalog
        </h1>
        <p class="mt-3 text-base leading-relaxed text-muted sm:text-lg">
          Electronics, fashion, and home essentials, all in one place.
        </p>
      </div>

      <div role="search" class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
        <div class="w-full sm:max-w-sm">
          <label for="search" class="mb-1.5 block text-sm font-semibold">Search products</label>
          <input
            id="search"
            type="search"
            autocomplete="off"
            placeholder="Try “desk”, “fashion”, or “gift”"
            class="w-full rounded-lg border border-line bg-white px-3.5 py-2.5 text-base placeholder:text-muted/70 focus:border-brand focus:ring-2 focus:ring-brand/30 focus:outline-hidden"
          />
        </div>
        <p id="result-count" class="text-sm text-muted" aria-live="polite">Showing 0 of 0 products</p>
      </div>

      <ul id="product-grid" role="list" class="grid grid-cols-1 gap-4 sm:grid-cols-2 sm:gap-6 lg:grid-cols-3"></ul>

      <div id="empty-state" hidden class="rounded-xl border border-dashed border-line bg-white px-6 py-12 text-center">
        <p class="text-lg font-semibold">No products found</p>
        <p class="mt-1 text-sm text-muted">
          Nothing matches “<span id="empty-query" class="font-semibold text-ink"></span>”. Try another keyword.
        </p>
      </div>
    </main>
  </body>
</html>
